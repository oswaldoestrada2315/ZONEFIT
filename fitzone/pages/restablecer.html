<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nueva contraseña — FitZone</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/layout.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-card__logo">
      <span class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" class="logo__mark"><path d="M2 12h3M19 12h3M5 8v8M19 8v8M8 12h8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>FitZone</span>
    </div>
    <h1>Crea una nueva contraseña</h1>
    <p class="auth-card__sub">Este enlace es de un solo uso. Elige una contraseña que no hayas usado antes.</p>

    <div id="formAlert"></div>

    <form id="resetForm" novalidate>
      <div class="form-field">
        <label for="password">Nueva contraseña</label>
        <div class="form-field__input-wrap">
          <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
          <button type="button" class="form-field__toggle-pw" id="togglePw1" aria-label="Mostrar contraseña">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/></svg>
          </button>
        </div>
        <div class="form-field__hint">Mínimo 8 caracteres.</div>
        <div class="form-field__error" id="passwordError"></div>
      </div>

      <div class="form-field">
        <label for="confirmPassword">Confirmar nueva contraseña</label>
        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
        <div class="form-field__error" id="confirmPasswordError"></div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Guardar contraseña</button>
    </form>
  </div>
</div>

<script src="../js/vendor/supabase.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/form-utils.js"></script>
<script src="../js/auth-reset.js"></script>
</body>
</html>
