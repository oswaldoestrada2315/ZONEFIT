<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progreso — FitZone</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/app.css">
</head>
<body data-page="progreso">
<main class="app-main" id="pageContent">
  <div class="app-header">
    <div>
      <h1>Progreso físico</h1>
      <p>Registra tu peso y medidas para ver tu evolución real a lo largo del tiempo, en cualquier dispositivo.</p>
    </div>
    <button class="btn btn-primary" id="openAddMeasurement">+ Registrar medida</button>
  </div>

  <div class="dash-grid">
    <section class="dash-card span-8">
      <h3>Evolución de peso <span style="font-size:var(--fs-xs);color:var(--text-muted);font-weight:400" id="chartRange"></span></h3>
      <svg id="weightChart" viewBox="0 0 640 220" style="width:100%;height:220px" preserveAspectRatio="none"></svg>
    </section>

    <section class="dash-card span-4">
      <h3>Comparación temporal</h3>
      <div id="comparisonBox"><p style="font-size:var(--fs-small)">Cargando…</p></div>
    </section>

    <section class="dash-card span-12">
      <h3>Historial de medidas</h3>
      <div style="overflow-x:auto">
        <table class="data-table" id="measurementsTable">
          <thead><tr><th>Fecha</th><th>Peso (kg)</th><th>Cintura (cm)</th><th>Cadera (cm)</th><th>Pecho (cm)</th><th>Brazo (cm)</th><th>Notas</th></tr></thead>
          <tbody id="measurementsBody"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<!-- Modal: nueva medida -->
<div class="modal-backdrop" id="measurementModal" hidden>
  <div class="modal">
    <h2 style="font-size:var(--fs-h3);margin-bottom:var(--space-6)">Registrar medida</h2>
    <div id="measurementAlert"></div>
    <form id="measurementForm">
      <div class="form-field">
        <label for="mDate">Fecha</label>
        <input type="date" id="mDate" required>
      </div>
      <div class="form-field">
        <label for="mWeight">Peso (kg)</label>
        <input type="number" step="0.1" id="mWeight" required>
      </div>
      <div class="form-field">
        <label for="mWaist">Cintura (cm) — opcional</label>
        <input type="number" step="0.1" id="mWaist">
      </div>
      <div class="form-field">
        <label for="mNotes">Notas — opcional</label>
        <input type="text" id="mNotes" maxlength="140">
      </div>
      <div style="display:flex;gap:var(--space-3)">
        <button type="button" class="btn btn-secondary btn-block" id="cancelMeasurement">Cancelar</button>
        <button type="submit" class="btn btn-primary btn-block" id="saveMeasurementBtn">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/vendor/supabase.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/db.js"></script>
<script src="../js/app-shell.js"></script>
<script src="../js/form-utils.js"></script>
<script src="../js/progreso.js" defer></script>
</body>
</html>
